<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>灵库 · AI第二大脑</title><link rel="stylesheet" href="/style.css"></head><body><header><b>灵库</b><span>AI 第二大脑</span><nav><button data-view="home">收藏</button><button data-view="manage">内容管理</button><button data-view="models">模型配置</button></nav></header><main>
<section id="home"><div class="hero"><h1>记住真正有用的东西。</h1><p>文章、链接、文字、图片、语音，丢进来，AI 帮你提炼和整理。</p><div class="search"><input id="search" placeholder="搜索我的第二大脑……"><button onclick="searchCards()">搜索</button></div><div class="capture"><textarea id="content" placeholder="粘贴文字或网址，或者写下一个灵感……"></textarea><div class="row"><select id="type"><option value="text">文字</option><option value="url">链接</option><option value="image">图片（骨架）</option><option value="audio">语音（骨架）</option></select><button class="primary" onclick="saveCard()">智能收藏</button></div></div></div><h2>最近收藏</h2><div id="cards" class="grid"></div></section>
<section id="manage" hidden><h1>内容管理</h1><p class="muted">测试版支持查看、编辑和删除知识卡片。</p><div id="table"></div></section>
<section id="models" hidden><h1>AI 模型管理</h1><p class="muted">模型配置先独立于业务代码，后续接 DeepSeek、OpenAI、Qwen 等。当前公网预览版不会保存真实 API Key，请勿在此填入正式密钥。</p><div class="panel"><input id="provider" placeholder="厂商，如 DeepSeek"><input id="model" placeholder="模型名称"><input id="base" placeholder="API Base URL"><input id="key" type="password" placeholder="API Key（预览版不会保存真实密钥）"><button class="primary" onclick="addModel()">添加模型</button></div><div id="modelList"></div></section>
</main><dialog id="dlg"><form method="dialog"><h3>编辑知识卡</h3><input id="eTitle"><textarea id="eOne"></textarea><input id="eCategory"><input id="eTags"><div class="row"><button value="cancel">取消</button><button value="default" class="primary" onclick="updateCard(event)">保存</button></div></form></dialog><script src="/app.js"></script></body></html>
